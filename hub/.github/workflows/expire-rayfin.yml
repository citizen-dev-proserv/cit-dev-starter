name: Expire Rayfin repositories

on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: expire-rayfin-repositories
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Warn and expire Rayfin repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          now="$(date -u +%s)"
          issues="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100")"

          while IFS= read -r issue; do
            issue_number="$(jq -r '.number' <<< "$issue")"
            comments="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100")"
            metadata="$(jq -c '[.[][] | select(.user.login == "github-actions[bot]") | .body | try capture("<!-- citizen-dev-lifecycle repository=(?<repository>[^ ]+) repository_id=(?<repository_id>[0-9]+) created_at=(?<created_at>[^ ]+) -->") catch empty] | last // empty' <<< "$comments")"

            if [[ -z "$metadata" ]]; then
              continue
            fi

            repository="$(jq -r '.repository' <<< "$metadata")"
            created_at="$(jq -r '.created_at' <<< "$metadata")"
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_seconds=$((now - created_epoch))

            if (( age_seconds >= 7 * 86400 )); then
              gh workflow run delete-rayfin.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$GITHUB_REF_NAME" \
                -f issue_number="$issue_number" \
                -f reason=expired
            elif (( age_seconds >= 6 * 86400 )); then
              warned="$(jq -r '[.[][] | select(.body | contains("<!-- citizen-dev-rayfin-expiry-warning -->"))] | length' <<< "$comments")"
              if [[ "$warned" == "0" ]]; then
                gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                  --body "<!-- citizen-dev-rayfin-expiry-warning -->
                Warning: Rayfin repository \`$repository\` is scheduled for automatic deletion approximately 24 hours from now. Close this issue to delete it immediately."
              fi
            fi
          done < <(jq -c '.[][] | select(.pull_request == null) | select(.title | startswith("[Provision Rayfin]"))' <<< "$issues")